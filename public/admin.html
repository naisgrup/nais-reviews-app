<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reseñas · Panel</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mu:#6b7280;--bd:#e5e7eb;--ok:#16a34a;--no:#dc2626;--pri:#111}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#eceef1;--mu:#9aa3af;--bd:#2a2f38;--pri:#eceef1}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.3rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;padding:10px 4px}.stat b{display:block;font-size:1.4rem}
.mu{color:var(--mu);font-size:.85rem}.star{color:#f5a623}
input,textarea,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input,textarea{width:100%}button{cursor:pointer;min-height:44px}button.pri{background:var(--pri);color:var(--bg);border:0}
button.ok{background:var(--ok);color:#fff;border:0}button.no{background:var(--no);color:#fff;border:0}
.tabs button.on{background:var(--pri);color:var(--bg)}.badge{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.reply{background:var(--bg);border-left:3px solid var(--mu);padding:8px 10px;margin-top:8px;border-radius:4px}
</style></head><body><main>
<h1>⭐ Panel de reseñas</h1>
<div id="login" class="card" hidden>
  <p>Contraseña de administrador</p>
  <input id="pw" type="password" autocomplete="current-password">
  <p><button class="pri" id="go">Entrar</button> <span id="err" class="mu"></span></p>
</div>
<div id="app" hidden>
  <div class="stats" id="stats"></div>
  <div class="row tabs" style="margin:12px 0">
    <button data-s="pending" class="on">Pendientes</button><button data-s="approved">Aprobadas</button>
    <button data-s="rejected">Rechazadas</button><button data-s="">Todas</button>
  </div>
  <div class="row"><input id="q" class="grow" placeholder="Buscar…" type="search"><button id="csv">CSV</button><button id="out">Salir</button></div>
  <div id="list"></div>
</div>
<script>
const $=s=>document.querySelector(s);let pw=localStorage.getItem('pw')||'',status='pending';
const api=(p,o={})=>fetch('/admin/api'+p,{...o,headers:{'x-admin-password':pw,'Content-Type':'application/json'}}).then(async r=>{if(r.status===401){logout();throw 0}return r});
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function logout(){localStorage.removeItem('pw');pw='';$('#app').hidden=true;$('#login').hidden=false}
async function load(){
  $('#login').hidden=true;$('#app').hidden=false;
  const s=await(await api('/stats')).json();
  $('#stats').innerHTML=[['Pend.',s.pending],['Aprob.',s.approved],['Rech.',s.rejected],['Media',s.average]].map(([a,b])=>`<div class="card stat"><b>${b}</b><span class="mu">${a}</span></div>`).join('');
  const rows=await(await api('/reviews?status='+status+'&q='+encodeURIComponent($('#q').value))).json();
  $('#list').innerHTML=rows.length?rows.map(r=>`<div class="card" data-id="${r.id}">
    <div class="row"><span class="star">${stars(r.rating)}</span><b class="grow">${esc(r.title)}</b><span class="badge">${r.status}</span></div>
    <p>${esc(r.body)}</p><div class="mu">${esc(r.author)} ${r.email?'· '+esc(r.email):''} · ${esc(r.product_title||r.product_id)} · ${esc(r.created_at)}</div>
    ${r.reply?`<div class="reply">${esc(r.reply)}</div>`:''}
    <textarea rows="2" placeholder="Responder públicamente…" style="margin-top:8px">${esc(r.reply||'')}</textarea>
    <div class="row" style="margin-top:8px"><button class="ok" data-a="approved">Aprobar</button><button class="no" data-a="rejected">Rechazar</button>
    <button data-a="reply">Guardar respuesta</button><button data-a="del">Borrar</button></div></div>`).join(''):'<p class="mu">Sin reseñas aquí.</p>';
}
$('#list').addEventListener('click',async e=>{
  const a=e.target.dataset.a;if(!a)return;const c=e.target.closest('.card'),id=c.dataset.id;
  if(a==='del'){if(!confirm('¿Borrar para siempre?'))return;await api('/reviews/'+id,{method:'DELETE'})}
  else if(a==='reply')await api('/reviews/'+id,{method:'PATCH',body:JSON.stringify({reply:c.querySelector('textarea').value})});
  else await api('/reviews/'+id,{method:'PATCH',body:JSON.stringify({status:a})});
  load();
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{status=b.dataset.s;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));load()});
let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,300)};
$('#out').onclick=logout;
$('#csv').onclick=async()=>{const b=await(await api('/export.csv')).blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='reseñas.csv';a.click()};
$('#go').onclick=async()=>{pw=$('#pw').value;const r=await fetch('/admin/api/stats',{headers:{'x-admin-password':pw}});if(r.ok){localStorage.setItem('pw',pw);load()}else $('#err').textContent='Contraseña incorrecta'};
pw?load().catch(()=>{}):($('#login').hidden=false);
</script></main></body></html>
